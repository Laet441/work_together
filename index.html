<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Live Cursors & Chat</title>
</head>
<body style="margin: 0; padding: 20px; font-family: system-ui, -apple-system, sans-serif; height: 100vh; overflow: hidden; background-color: #fafafa;">

    <!-- Стилизованное инпут-поле для отправки сообщений -->
    <div style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; gap: 10px;">
        <input type="text" id="chatInput" placeholder="Напишите что-нибудь и нажмите Enter..." 
               style="width: 280px; padding: 12px; border: 3px solid black; border-radius: 8px; box-shadow: 4px 4px 0px black; font-weight: bold; font-size: 14px; outline: none;">
    </div>

    <script>
        // ⚠️ ВНИМАНИЕ: Обязательно замените адрес ниже на ВАШУ РЕАЛЬНУЮ ссылку от Render!
        // Протокол должен быть строго wss:// (например, wss://://onrender.com)
        const HOST = window.location.origin.replace(/^http/, 'ws');
        const ws = new WebSocket(HOST); 

        const remoteCursors = {};

        // 1. Отслеживаем и отправляем движения мыши
        window.addEventListener('mousemove', (event) => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'move', x: event.clientX, y: event.clientY }));
            }
        });

        // Отслеживаем тачи для мобильных устройств (чтобы курсор бегал по экрану телефона)
        window.addEventListener('touchmove', (event) => {
            if (ws.readyState === WebSocket.OPEN && event.touches.length > 0) {
                const touch = event.touches[0];
                ws.send(JSON.stringify({ type: 'move', x: touch.clientX, y: touch.clientY }));
            }
        });

        // 2. Отслеживаем и отправляем клики
        window.addEventListener('click', (event) => {
            if (event.target === document.getElementById('chatInput')) return; // Игнорируем клик по инпуту
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'click', x: event.clientX, y: event.clientY }));
            }
        });

        // 3. Отправка сообщений в чат при нажатии кнопки Enter
        const input = document.getElementById('chatInput');
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && input.value.trim() !== '') {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'chat', text: input.value }));
                    input.value = ''; // Стираем текст из поля после отправки
                }
            }
        });

        // 4. Обработка всех входящих событий с сервера
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Если пользователь закрыл вкладку — удаляем его курсор с экрана
            if (data.type === 'disconnect') {
                if (remoteCursors[data.id]) {
                    remoteCursors[data.id].container.remove();
                    delete remoteCursors[data.id];
                }
                return;
            }

            // Если кто-то кликнул — создаем на полсекунды цветной кружок
            if (data.type === 'click') {
                const clickEffect = document.createElement('div');
                clickEffect.innerText = '⭕';
                clickEffect.style.position = 'absolute';
                clickEffect.style.left = (data.x - 10) + 'px';
                clickEffect.style.top = (data.y - 14) + 'px';
                clickEffect.style.color = data.color;
                clickEffect.style.fontSize = '24px';
                clickEffect.style.pointerEvents = 'none';
                clickEffect.style.zIndex = '999';
                document.body.appendChild(clickEffect);
                setTimeout(() => clickEffect.remove(), 500);
                return; 
            }

            // Если кто-то отправил сообщение в чат — выводим его в облачко над курсором
            if (data.type === 'chat' && remoteCursors[data.id]) {
                const chatBubble = remoteCursors[data.id].bubble;
                chatBubble.innerText = data.text;
                chatBubble.style.display = 'block'; // Показываем облачко
                
                // Автоматически прячем сообщение обратно через 4 секунды
                if (remoteCursors[data.id].chatTimeout) clearTimeout(remoteCursors[data.id].chatTimeout);
                remoteCursors[data.id].chatTimeout = setTimeout(() => {
                    chatBubble.style.display = 'none';
                }, 4000);
                return;
            }

            // Если кто-то двигает мышь — создаем или обновляем его стрелочку
            if (data.type === 'move') {
                if (!remoteCursors[data.id]) {
                    const cursorContainer = document.createElement('div');
                    cursorContainer.style.position = 'absolute';
                    cursorContainer.style.pointerEvents = 'none';
                    cursorContainer.style.display = 'flex';
                    cursorContainer.style.flexDirection = 'column';
                    cursorContainer.style.alignItems = 'flex-start';
                    cursorContainer.style.zIndex = '100';

                    // Облачко для сообщений чата (по умолчанию скрыто)
                    const bubble = document.createElement('div');
                    bubble.style.display = 'none'; 
                    bubble.style.backgroundColor = '#fff';
                    bubble.style.color = '#000';
                    bubble.style.border = '2px solid black';
                    bubble.style.padding = '5px 10px';
                    bubble.style.borderRadius = '8px';
                    bubble.style.fontSize = '12px';
                    bubble.style.fontWeight = 'bold';
                    bubble.style.marginBottom = '4px';
                    bubble.style.boxShadow = '2px 2px 0px black';
                    bubble.style.maxWidth = '150px';
                    bubble.style.wordBreak = 'break-word';

                    // Ровная и красивая SVG-стрелочка
                    const svgWrapper = document.createElement('div');
                    svgWrapper.innerHTML = `
                        <svg width="32" height="32" viewBox="0 0 100 100" style="display:block;">
                            <path d="M15,15 L85,40 C92,43 90,53 82,54 L52,60 L40,90 C38,98 28,96 26,89 L12,23 C11,16 17,11 15,15 Z" 
                                  stroke="black" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" id="svg-path-${data.id}" />
                        </svg>
                    `;

                    // Плашка никнейма с жирной обводкой и плоской черной тенью
                    const label = document.createElement('span');
                    label.innerText = data.name; 
                    label.style.fontSize = '12px';
                    label.style.fontWeight = 'bold';
                    label.style.padding = '3px 8px';
                    label.style.borderRadius = '5px';
                    label.style.color = '#fff';
                    label.style.marginTop = '1px'; 
                    label.style.border = '2px solid black';
                    label.style.boxShadow = '2px 2px 0px rgba(0,0,0,1)';

                    cursorContainer.appendChild(bubble);
                    cursorContainer.appendChild(svgWrapper);
                    cursorContainer.appendChild(label);
                    document.body.appendChild(cursorContainer);
                    
                    const pathElement = svgWrapper.querySelector(`#svg-path-${data.id}`);
                    remoteCursors[data.id] = { container: cursorContainer, label: label, path: pathElement, bubble: bubble };
                }

                // Двигаем контейнер за координатами мыши другого игрока
                remoteCursors[data.id].container.style.left = data.x + 'px';
                remoteCursors[data.id].container.style.top = data.y + 'px';
                remoteCursors[data.id].label.style.backgroundColor = data.color; 
                remoteCursors[data.id].path.setAttribute('fill', data.color);
            }
        };
    </script>
</body>
</html>
